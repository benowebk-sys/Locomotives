<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locomotives & Rolling Stock</title>
    <!-- استدعاء Tailwind CSS و الخطوط -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styel.css">
</head>
<body>

    <div id="progress-bar"><div id="progress-fill"></div></div>

    <header class="bg-black py-4 md:py-8 text-center relative z-10">
        <h1 class="header-title font-bold px-4">Locomotives & Rolling Stock</h1>
        <div class="header-border absolute bottom-0 left-0"></div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-4 md:py-8 flex flex-col items-center justify-start md:justify-center relative z-10">
        <!-- Bebo Character Section -->
        <div class="bebo-wrapper">
            <div id="bebo-bubble" class="bebo-bubble">يا هلا يا هلا</div>
            <div id="bebo-robot" class="bebo-robot">
                <div class="eyes-container">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
            </div>
        </div>

        <!-- Quiz Container -->
        <div id="quiz-container" class="w-full max-w-2xl lg:max-w-3xl">
            <div id="question-card" class="question-card rounded-sm overflow-hidden mb-4 md:mb-6">
                <!-- Hint Section -->
                <div class="hint-container px-4 py-2 md:px-6 md:py-4 flex items-center justify-between" onclick="toggleHint()">
                    <div class="text-[8px] md:text-[11px] tracking-[0.1em] md:tracking-[0.3em] text-zinc-600 font-bold uppercase">
                        HINT SERVICE: 
                        <div id="hint-content" class="hidden inline-block ml-2">
                            <span id="hint-text" class="italic text-zinc-200 text-[10px] md:text-sm">...</span>
                            <span id="hint-translation" class="text-zinc-500 block text-[9px] md:text-[10px] lowercase italic">...</span>
                        </div>
                    </div>
                    <div id="bulb-wrapper">
                        <svg class="bulb-icon" viewBox="0 0 24 24">
                            <path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6A4.997 4.997 0 0 1 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.06-2.15 4.1zM9 19h6c.55 0 1 .45 1 1s-.45 1-1 1H9c-.55 0-1-.45-1-1s.45-1 1-1z"/>
                        </svg>
                    </div>
                </div>

                <!-- Question Content -->
                <div class="p-5 md:p-10">
                    <p id="question-number" class="text-zinc-500 font-bold mb-2 md:mb-4 uppercase tracking-[0.2em] text-[8px] md:text-xs">ASSESSMENT POINT</p>
                    <div class="mb-6 md:mb-10">
                        <h2 id="question-text" class="text-sm md:text-xl font-medium leading-snug md:leading-relaxed text-zinc-300">Initializing...</h2>
                        <span id="question-translation" class="translation-text text-zinc-500 mt-1 md:mt-2">جاري التحميل...</span>
                    </div>
                    <div id="options-container" class="grid grid-cols-1 gap-2 md:gap-4"></div>
                </div>
            </div>

            <!-- Navigation Controls -->
            <div class="flex flex-wrap justify-between gap-2 md:gap-3">
                <button id="back-btn" onclick="prevQuestion()" class="nav-btn px-4 py-2 md:px-10 md:py-3 rounded-sm font-bold uppercase flex-1 md:flex-none">Back</button>
                <div class="flex gap-2 md:gap-3 flex-[2] md:flex-none">
                    <button id="skip-btn" onclick="nextQuestion()" class="nav-btn px-4 py-2 md:px-10 md:py-3 rounded-sm font-bold uppercase flex-1">Skip</button>
                    <button id="next-btn" onclick="nextQuestion()" class="nav-btn px-4 py-2 md:px-10 md:py-3 rounded-sm font-bold uppercase flex-1 bg-zinc-900 border-zinc-700">Next</button>
                </div>
            </div>
        </div>

        <!-- Result View -->
        <div id="result-view" class="hidden w-full max-w-xl text-center bg-zinc-950 p-6 md:p-16 rounded-sm border border-zinc-900">
            <h2 class="text-lg md:text-2xl font-bold mb-4 text-zinc-500 uppercase tracking-widest"> Finali</h2>
            <div class="final-score-val font-black text-4xl md:text-6xl text-white mb-2" id="final-score">0%</div>
            <p id="result-message" class="text-zinc-400 mb-8 md:mb-10 font-medium text-sm md:text-base"></p>
            <button onclick="restartQuiz()" class="border border-zinc-500 text-zinc-300 px-8 py-3 md:py-4 rounded-sm text-[10px] md:text-xs font-bold uppercase hover:bg-white hover:text-black transition-all">Restart Sequence</button>
        </div>
    </main>

    <footer class="bg-black py-6 border-t border-zinc-900 z-10 mt-auto">
        <div class="container mx-auto px-4 text-center">
            <p class="text-zinc-600 font-bold tracking-[0.2em] md:tracking-[0.3em] uppercase text-[10px] md:text-xs">Developer Bilal Muhammad</p>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
